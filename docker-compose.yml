version: '3.8'

# Load environment variables from backend/.env
# Docker Compose will use these for ${VAR} substitutions

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: expert_outreach
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/expert_outreach
      - REDIS_URL=redis://redis:6379/0
      - API_KEY=${API_KEY:-dev-api-key-change-in-production}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-dev-webhook-secret-change-in-production}
      - RESEND_API_KEY
      - RESEND_FROM_EMAIL
      - RESEND_FROM_NAME
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - SENDGRID_FROM_EMAIL=${SENDGRID_FROM_EMAIL:-outreach@example.com}
      - SENDGRID_FROM_NAME=${SENDGRID_FROM_NAME:-Expert Outreach}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-3-5-sonnet-20241022}
      - APOLLO_API_KEY=${APOLLO_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  worker:
    build: ./backend
    command: python worker.py
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/expert_outreach
      - REDIS_URL=redis://redis:6379/0
      - RESEND_API_KEY
      - RESEND_FROM_EMAIL
      - RESEND_FROM_NAME
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - SENDGRID_FROM_EMAIL=${SENDGRID_FROM_EMAIL:-outreach@example.com}
      - SENDGRID_FROM_NAME=${SENDGRID_FROM_NAME:-Expert Outreach}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-3-5-sonnet-20241022}
      - APOLLO_API_KEY=${APOLLO_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
        VITE_API_KEY: ${API_KEY:-dev-api-key-change-in-production}
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
